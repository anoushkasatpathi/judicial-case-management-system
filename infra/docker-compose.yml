services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: justiq
      POSTGRES_USER: justiq
      POSTGRES_PASSWORD: justiq
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: justiq
      MINIO_ROOT_PASSWORD: justiq-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
